<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Brewlog</title>
<meta name="description" content="A personal coffee tasting journal — beans, tasting profiles, and cafes.">
<!-- In Safari this tints the bars above and below the page. It cannot be a
     gradient, so it is set to the colour the ambient background actually
     resolves to at the very top of the screen — that is what makes the seam
     disappear. Installed to the Home Screen the page genuinely extends behind
     the status bar instead (see apple-mobile-web-app-status-bar-style). -->
<meta name="theme-color" content="#1D1611">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brewlog">

<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div id="ambient"></div>

<main id="app" role="main"></main>
<nav id="tabbar" aria-label="Primary"></nav>

<script src="./vendor/leaflet.js" defer></script>
<!-- MapLibre GL (vector renderer) + the Leaflet bridge that lets it act as
     a normal Leaflet tile layer. Both are classic (non-module) scripts
     loaded with defer, same as leaflet.js above, so script-order = execution
     order and each one's global (L, then maplibregl, then L.maplibreGL) is
     guaranteed to exist before the next one runs. -->
<script src="./vendor/maplibre-gl.js" defer></script>
<script src="./vendor/leaflet-maplibre-gl.js" defer></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
