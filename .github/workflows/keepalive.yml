name: Keep Supabase awake

# Supabase pauses free-plan projects after ~7 days without activity.
# This pings the project every 3 days: one REST request with the public
# publishable key (same one baked into js/config.js) and one `select 1`
# through the SUPABASE_DB_URL secret already used by main.yml.
#
# If the project is already paused the REST call fails, the run goes red,
# and GitHub emails you — restore it from the Supabase dashboard.
#
# Note: GitHub disables scheduled workflows in public repos after 60 days
# with no commits. It emails first; re-enable from the Actions tab.

on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://uszcbsovcdzzfxqtzazb.supabase.co
      SUPABASE_KEY: sb_publishable_JHn6cJ4kGirP2eTWKaQRXg_Ft2FJpH4
    steps:
      - name: REST API ping
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/cafes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"; head -c 300 /tmp/body; echo
          [ "$code" -lt 400 ]

      - name: Database ping
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "SUPABASE_DB_URL not set, skipping"; exit 0; fi
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -tAc 'select 1'
