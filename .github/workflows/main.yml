name: Push schema to Supabase

# Applies schema.sql and deploys the gemini-proxy Edge Function whenever
# either changes on main. Also runnable by hand from the Actions tab.
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL        Session-pooler connection string, e.g.
#                          postgresql://postgres.uszcbsovcdzzfxqtzazb:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#                          Use the SESSION POOLER string, not "Direct connection":
#                          db.<ref>.supabase.co is IPv6-only and GitHub runners are IPv4.
#   SUPABASE_ACCESS_TOKEN  Personal access token from Supabase -> Account -> Access Tokens
#                          (only needed for the function job)

on:
  push:
    branches: [main]
    paths:
      - 'schema.sql'
      - 'supabase/functions/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: uszcbsovcdzzfxqtzazb

jobs:
  schema:
    name: Apply schema.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is set
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set."
            exit 1
          fi

      - name: Install psql
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          }
          psql --version

      # Deliberately NOT --single-transaction: schema.sql's storage section
      # relies on DO/exception blocks that only degrade gracefully when the
      # earlier statements have already committed.
      - name: Run schema.sql
        env:
          PGCONNECT_TIMEOUT: '20'
        run: |
          psql "${{ secrets.SUPABASE_DB_URL }}" \
            --set ON_ERROR_STOP=1 \
            --echo-errors \
            --file schema.sql

  functions:
    name: Deploy gemini-proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            exit 1
          fi
          supabase functions deploy gemini-proxy --project-ref "$PROJECT_REF"
